<style>
:root {
  --void: #04040c;
  --void2: #07071a;
  --void3: #0a0a1e;
  --purple: #8800ff;
  --purple-dim: #440088;
  --purple-bright: #aa44ff;
  --red: #7a0000;
  --red-bright: #bb1a00;
  --red-glow: #ee3300;
  --blue: #050d2e;
  --blue-mid: #0a1a55;
  --blue-bright: #1a3a99;
  --blue-glow: #2255cc;
  --blue-star: #4488ff;
  --white: #f0eaf8;
  --text: #c0b8d8;
  --text-dim: #60567a;
  --text-muted: #2a2040;
  --mono: 'Share Tech Mono', monospace;
  --display: 'Barlow Condensed', sans-serif;
  --body: 'Barlow', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--void);
  color: var(--text);
  font-family: var(--body);
  min-height: 100vh;
  cursor: crosshair;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
  pointer-events: none;
  z-index: 1000;
}

/* ─── NAV ─── */
.nav-strip {
  position: sticky;
  top: 0; z-index: 100;
  background: rgba(4,4,12,0.97);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(34,85,204,0.2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4rem;
  height: 52px;
}
.nav-strip::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, var(--red-bright), var(--blue-glow), transparent);
}
.nav-logo {
  font-family: var(--display);
  font-size: 1.1rem;
  font-weight: 900;
  letter-spacing: 0.12em;
  color: var(--white);
  text-decoration: none;
}
.acc-p { color: var(--purple-bright); }
.acc-r { color: var(--red-glow); }
.nav-right {
  display: flex;
  align-items: center;
  gap: 2rem;
  height: 100%;
}
.nav-link {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.15em;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.15s;
}
.nav-link:hover { color: var(--blue-star); }
.nav-link.active { color: var(--purple-bright); }
.nav-tags { display: flex; height: 100%; }
.nav-tag {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.15em;
  color: var(--text-muted);
  padding: 0 1.1rem;
  cursor: pointer;
  border: none; background: none;
  height: 100%;
  display: flex; align-items: center;
  transition: all 0.15s;
  border-bottom: 2px solid transparent;
  position: relative; top: 1px;
}
.nav-tag:hover { color: var(--blue-star); }
.nav-tag.active { color: var(--purple-bright); border-bottom-color: var(--purple); }

/* ─── HERO ─── */
.page-hero {
  padding: 5rem 4rem 3rem;
  max-width: 1200px;
  margin: 0 auto;
  border-bottom: 1px solid rgba(34,85,204,0.1);
  position: relative;
}
.page-hero::before {
  content: '';
  position: absolute;
  bottom: 0; left: 4rem;
  width: 120px; height: 1px;
  background: linear-gradient(90deg, var(--red-bright), var(--blue-glow));
}
.page-eyebrow {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.3em;
  color: var(--blue-bright);
  margin-bottom: 1.25rem;
  display: flex; align-items: center; gap: 1rem;
}
.page-eyebrow::before {
  content: '';
  display: block;
  width: 30px; height: 1px;
  background: linear-gradient(90deg, var(--red-bright), var(--blue-glow));
}
.page-title {
  font-family: var(--display);
  font-size: clamp(3rem, 8vw, 6rem);
  font-weight: 900;
  line-height: 0.9;
  color: var(--white);
  margin-bottom: 1.5rem;
}
.page-sub {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  line-height: 1.8;
  max-width: 480px;
}

/* ─── MAIN ─── */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 4rem;
}

/* ─── FILTER BAR ─── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 3rem;
  border: 1px solid rgba(34,85,204,0.15);
  width: fit-content;
}
.filter-btn {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.18em;
  color: var(--text-muted);
  background: none;
  border: none;
  border-right: 1px solid rgba(34,85,204,0.15);
  padding: 9px 18px;
  cursor: pointer;
  transition: all 0.15s;
}
.filter-btn:last-child { border-right: none; }
.filter-btn:hover { color: var(--blue-star); background: rgba(34,85,204,0.05); }
.filter-btn.active { color: var(--purple-bright); background: rgba(136,0,255,0.06); }

/* ─── SECTION HEADER ─── */
.section-header {
  display: flex; align-items: center; gap: 1.5rem;
  margin-bottom: 2rem;
}
.section-label {
  font-family: var(--mono);
  font-size: 0.6rem; letter-spacing: 0.3em;
  color: var(--text-muted);
}
.section-rule {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--red-bright) 0%, var(--purple) 20%, var(--blue-glow) 50%, transparent 80%);
}
.section-count {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--blue-bright);
}

/* ─── GUIDE GRID ─── */
.guide-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: rgba(34,85,204,0.07);
  margin-bottom: 5rem;
}

.guide-card {
  background: var(--void);
  padding: 2rem;
  cursor: pointer;
  transition: background 0.2s;
  display: flex;
  flex-direction: column;
  min-height: 260px;
  position: relative;
  overflow: hidden;
}
.guide-card:hover {
  background: linear-gradient(160deg, var(--void2) 0%, rgba(5,13,46,0.6) 100%);
}
.guide-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--purple), var(--blue-star), var(--red-bright));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
}
.guide-card:hover::after { transform: scaleX(1); }

.guide-num {
  font-family: var(--mono);
  font-size: 3rem;
  color: var(--text-muted);
  line-height: 1;
  margin-bottom: 1.5rem;
  letter-spacing: -0.05em;
}
.guide-cat {
  font-family: var(--mono);
  font-size: 0.55rem;
  letter-spacing: 0.2em;
  margin-bottom: 0.75rem;
}
.guide-card:nth-child(3n+1) .guide-cat { color: var(--purple-bright); }
.guide-card:nth-child(3n+2) .guide-cat { color: var(--blue-star); }
.guide-card:nth-child(3n+3) .guide-cat { color: var(--red-glow); }

.guide-title {
  font-family: var(--display);
  font-size: 1.2rem;
  font-weight: 700;
  line-height: 1.2;
  color: var(--white);
  margin-bottom: 0.75rem;
  flex: 1;
}
.guide-hook {
  font-size: 0.8rem;
  line-height: 1.7;
  color: var(--text-dim);
  font-weight: 300;
  margin-bottom: 1.5rem;
}
.guide-meta {
  font-family: var(--mono);
  font-size: 0.55rem;
  color: var(--text-muted);
  letter-spacing: 0.12em;
  display: flex; align-items: center; justify-content: space-between;
}
.guide-meta-arrow { color: var(--blue-bright); transition: color 0.15s; }
.guide-card:hover .guide-meta-arrow { color: var(--blue-star); }
.guide-time {
  font-family: var(--mono);
  font-size: 0.52rem;
  letter-spacing: 0.12em;
  color: var(--text-muted);
}

/* ─── GUIDE VIEW ─── */
.guide-view { display: none; }
.guide-view.open { display: block; }
.guides-view.hidden { display: none; }

.guide-full {
  max-width: 720px;
  margin: 0 auto;
  padding: 5rem 4rem;
}
.back {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  color: var(--text-dim);
  background: none;
  border: 1px solid rgba(34,85,204,0.2);
  padding: 8px 18px;
  cursor: pointer;
  margin-bottom: 3rem;
  display: inline-flex; align-items: center; gap: 0.75rem;
  transition: all 0.15s;
}
.back:hover { color: var(--blue-star); border-color: var(--blue-glow); }

.guide-full-eyebrow {
  font-family: var(--mono);
  font-size: 0.6rem; letter-spacing: 0.25em;
  color: var(--blue-star);
  margin-bottom: 1rem;
}
.guide-full-title {
  font-family: var(--display);
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 900;
  line-height: 1.05;
  color: var(--white);
  margin-bottom: 1rem;
}
.guide-full-meta {
  font-family: var(--mono);
  font-size: 0.6rem; letter-spacing: 0.15em;
  color: var(--text-muted);
  padding: 1.25rem 0;
  border-top: 1px solid rgba(180,20,0,0.15);
  border-bottom: 1px solid rgba(34,85,204,0.15);
  margin-bottom: 2.5rem;
  display: flex; gap: 2rem;
}

/* Guide body styles */
.guide-body .tools-block {
  border-left: 2px solid var(--purple-dim);
  padding: 1.25rem 1.5rem;
  margin: 0 0 2.5rem;
  background: rgba(136,0,255,0.04);
  font-family: var(--mono);
  font-size: 0.78rem;
  line-height: 1.8;
  color: var(--text);
}
.guide-body .tools-block strong {
  display: block;
  font-size: 0.6rem; letter-spacing: 0.25em;
  color: var(--purple-bright);
  margin-bottom: 0.6rem;
}
.guide-body .step {
  display: flex;
  gap: 1.5rem;
  margin-bottom: 1.75rem;
  align-items: flex-start;
}
.guide-body .step-num {
  font-family: var(--mono);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text-muted);
  line-height: 1;
  flex-shrink: 0;
  width: 2rem;
  padding-top: 0.15rem;
}
.guide-body .step-content {
  flex: 1;
}
.guide-body .step-content strong {
  display: block;
  font-family: var(--display);
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--white);
  margin-bottom: 0.4rem;
  text-transform: uppercase;
}
.guide-body .step-content p {
  font-size: 0.92rem;
  line-height: 1.8;
  color: var(--text);
  font-weight: 300;
}
.guide-body .warn-block {
  border-left: 2px solid var(--red-bright);
  padding: 1.25rem 1.5rem;
  margin: 2rem 0;
  background: rgba(180,20,0,0.05);
  font-family: var(--mono);
  font-size: 0.78rem;
  line-height: 1.8;
  color: var(--text);
}
.guide-body .warn-block strong {
  display: block;
  font-size: 0.6rem; letter-spacing: 0.25em;
  color: var(--red-glow);
  margin-bottom: 0.6rem;
}
.guide-body code {
  font-family: var(--mono);
  font-size: 0.85em;
  color: var(--blue-star);
  background: rgba(34,85,204,0.1);
  padding: 1px 6px;
}
.steps-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  color: var(--text-muted);
  margin-bottom: 1.75rem;
  display: flex; align-items: center; gap: 1rem;
}
.steps-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(34,85,204,0.3), transparent);
}

/* Share bar */
.share-bar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid rgba(34,85,204,0.12);
}
.share-label {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  margin-right: 0.5rem;
}
.share-btn {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  padding: 7px 14px;
  border: 1px solid rgba(34,85,204,0.25);
  background: none;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
}
.share-btn:hover { color: var(--blue-star); border-color: var(--blue-glow); background: rgba(34,85,204,0.08); }
.share-btn.copied { color: var(--purple-bright); border-color: var(--purple-dim); }

/* ─── FOOTER ─── */
footer {
  border-top: 1px solid rgba(34,85,204,0.08);
  padding: 2rem 4rem;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.footer-copy {
  font-family: var(--mono);
  font-size: 0.52rem; letter-spacing: 0.15em;
  color: var(--text-muted);
}
.footer-link {
  font-family: var(--mono);
  font-size: 0.52rem; letter-spacing: 0.15em;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.15s;
}
.footer-link:hover { color: var(--purple-bright); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.page-eyebrow { animation: fadeUp 0.7s ease both 0.1s; }
.page-title   { animation: fadeUp 0.7s ease both 0.2s; }
.page-sub     { animation: fadeUp 0.7s ease both 0.3s; }

@media (max-width: 900px) {
  .guide-grid { grid-template-columns: 1fr 1fr; }
  .nav-strip, .page-hero, .main, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
  .guide-full { padding: 3rem 1.5rem; }
}
@media (max-width: 600px) {
  .guide-grid { grid-template-columns: 1fr; }
  .nav-tags { display: none; }
  footer { flex-direction: column; gap: 0.75rem; align-items: flex-start; }
}
</style>
</head>

const guides = [

let activeFilter = 'all';

function renderGrid() {
  const grid = document.getElementById('guideGrid');
  const filtered = activeFilter === 'all' ? guides : guides.filter(g => g.filter === activeFilter);
  document.getElementById('guideCount').textContent = filtered.length + ' guides';
  grid.innerHTML = filtered.map((g, i) => `
    <div class="guide-card" onclick="openGuide(${g.id})">
      <div class="guide-num">0${i+1}</div>
      <div class="guide-cat">${g.cat}</div>
      <div class="guide-title">${g.title}</div>
      <div class="guide-hook">${g.hook}</div>
      <div class="guide-meta">
        <span>${g.time} · saves ${g.saves}</span>
        <span class="guide-meta-arrow">→</span>
      </div>
    </div>`).join('');
}

function filter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.nav-tag').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  renderGrid();
}

function openGuide(id) {
  const g = guides.find(x => x.id === id);
  if (!g) return;
  const url = `${location.origin}${location.pathname}#guide-${id}`;
  const tweetText = encodeURIComponent(`${g.title} — ${url}`);
  document.getElementById('guidesView').classList.add('hidden');
  document.getElementById('guideView').classList.add('open');
  const stepsHtml = g.steps.map((s, i) => `
    <div class="step">
      <div class="step-num">${i+1}</div>
      <div class="step-content">
        <strong>${s.h}</strong>
        <p>${s.b}</p>
      </div>
    </div>`).join('');
  document.getElementById('guideContent').innerHTML = `
    <button class="back" onclick="closeGuide()">← ALL GUIDES</button>
    <div class="guide-full-eyebrow">${g.cat} // FIELD GUIDE</div>
    <h1 class="guide-full-title">${g.title}</h1>
    <div class="guide-full-meta">
      <span>TIME: ${g.time}</span>
      <span>SAVES: ${g.saves}</span>
    </div>
    <div class="guide-body">
      <div class="tools-block"><strong>// TOOLS &amp; MATERIALS</strong>${g.tools}</div>
      <div class="steps-label">// steps</div>
      ${stepsHtml}
      <div class="warn-block"><strong>// HEADS UP</strong>${g.warn}</div>
    </div>
    <div class="share-bar">
      <span class="share-label">// share</span>
      <button class="share-btn" onclick="copyLink('${url}', this)">COPY LINK</button>
      <button class="share-btn" onclick="window.open('https://x.com/intent/tweet?text=${tweetText}','_blank')">POST ON X</button>
      <button class="share-btn" onclick="window.open('https://www.reddit.com/submit?url=${encodeURIComponent(url)}&title=${encodeURIComponent(g.title)}','_blank')">POST TO REDDIT</button>
    </div>`;
  window.scrollTo(0,0);
}

function copyLink(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = 'COPIED';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'COPY LINK'; btn.classList.remove('copied'); }, 2000);
  });
}

function closeGuide() {
  document.getElementById('guidesView').classList.remove('hidden');
  document.getElementById('guideView').classList.remove('open');
  window.scrollTo(0,0);
}

renderGrid();
</script>
